name: Signaler un problème
description: Quelque chose ne fonctionne pas sur votre hotspot WebLink
title: "[Problème] "
labels: ["problème"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. Plus il y a de détails, plus il sera corrigé vite.
  - type: input
    id: version
    attributes:
      label: Version de WebLink
      description: Elle est affichée dans la page Status ou la page Infos (par exemple 6TB10)
      placeholder: 6TB10
    validations:
      required: true
  - type: dropdown
    id: connexion
    attributes:
      label: Connexion du hotspot
      options:
        - Rj45 (câble réseau)
        - Wifi
        - Point d'accès WebLink
        - Je ne sais pas
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module radio
      options:
        - Sa818
        - Pas de module radio
        - Autre
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Décrivez ce que vous constatez, et ce que vous attendiez à la place
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire ?
      description: Les étapes qui mènent au problème
      placeholder: |
        1. Aller dans la page Configuration
        2. Cliquer sur ..
        3. ..
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic
      description: Dans la page Status, cliquez sur le bouton de copie du diagnostic, puis collez-le ici
      render: text
  - type: textarea
    id: captures
    attributes:
      label: Captures d'écran
      description: Si utile, glissez vos captures d'écran ici
